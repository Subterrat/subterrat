name: subterrat_app
description: "SubTerrat — 臺北見鼠通報熱點預測介面"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # DM Mono 字型檔（assets/fonts/DMMono-*.ttf）從未進版控，`fonts:` 宣告指到
  # 不存在的檔案會讓 `flutter pub get`／build 失敗。移除宣告前先確認過
  # lib/theme.dart 的 kMonoFamily 只是一個 fontFamily 字串常數：字型缺席時
  # Flutter 會安靜地退回預設字型，不會噴例外。要恢復 DM Mono，把檔案放進
  # assets/fonts/ 後解除下面的註解即可。
  # fonts:
  #   - family: DM Mono
  #     fonts:
  #       - asset: assets/fonts/DMMono-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/DMMono-Medium.ttf
  #         weight: 500
