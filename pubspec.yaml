name: subterrat_app
description: "SubTerrat — 臺北見鼠通報熱點介面"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0
  http: ^1.2.0
  flutter_dotenv: ^5.2.1
  google_fonts: ^8.2.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # .env holds GOOGLE_MAPS_API_KEY (see .env.example). It's gitignored —
  # flutter_dotenv still needs it declared here so `flutter build`/`run`
  # bundles whatever real .env exists on the machine doing the build.
  assets:
    - .env
    - assets/images/logo_mark.png
