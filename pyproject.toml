[project]
name = "subterrat"
version = "0.1.0"
description = "SubTerrat: Taipei structural rat-hotspot ranking pipeline and read-only Cloud Run API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "google-cloud-bigquery>=3.25,<4.0",
    "pydantic>=2.9,<3.0",
]

[dependency-groups]
dev = [
    "pyproj==3.7.2",
    "pyshp==2.3.1",
    "s2sphere==0.2.5",
    "shapely==2.1.1",
    "httpx>=0.27,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
